name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }} / pytest ${{ matrix.pytest }}${{ matrix.xdist && format(' / xdist {0}', matrix.xdist) || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        pytest: ["latest"]
        include:
          - { os: ubuntu-latest, python: "3.10", pytest: "7.3", xdist: "3.7.0" }
          - { os: ubuntu-latest, python: "3.11", pytest: "7.4" }
          - { os: ubuntu-latest, python: "3.12", pytest: "8.0" }
          - { os: windows-latest, python: "3.12", pytest: "latest" }
          - { os: macos-latest, python: "3.13", pytest: "latest" }
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          uv sync --no-dev
          uv pip install pytest-xdist pytest-rerunfailures hypothesis
          if [ "${{ matrix.pytest }}" != "latest" ]; then uv pip install "pytest~=${{ matrix.pytest }}.0"; fi
          if [ -n "${{ matrix.xdist }}" ]; then uv pip install "pytest-xdist==${{ matrix.xdist }}"; fi
        shell: bash
      - name: Test
        run: uv run --no-sync pytest -v -p no:cacheprovider
        if: matrix.os != 'macos-latest'
      - name: Test (DIAG, macOS loop under load)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          uv run --no-sync pytest -q -p no:cacheprovider > /dev/null 2>&1 &
          for i in 1 2 3 4 5 6 7 8; do
            uv run --no-sync pytest -q -rP -p no:cacheprovider -k "shared_fixtures_are_recorded or runtime_wait_is_excluded" || true
          done
          wait

  no-xdist:
    name: without pytest-xdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
      - run: uv sync --no-dev
      - run: uv pip install hypothesis
      - run: uv run --no-sync pytest -v -p no:cacheprovider

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy
